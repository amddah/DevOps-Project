name: CI/CD with terraform
on:
  push:
    branches:
      - Complete-CI/CD-with-Terraform-AWS
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_STATE_BUCKET_NAME: ${{ secrets.AWS_TF_STATE_BUCKET_NAME }}
  PRIVATE_SSH_KEY: ${{ secrets.AWS_SSH_KEY_PRIVATE }}
  PUBLIC_SSH_KEY: ${{ secrets.AWS_SSH_KEY_PUBLIC }}
  AWS_REGION: eu-west-3

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    outputs:
      SERVER_PUBLIC_IP: ${{steps.set-ip.outputs.instance_public_ip}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # Mise à jour ici
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3  # Mise à jour ici
        with:
          terraform_wrapper: false
      - name: Terraform Init
        id: init
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET_NAME" -backend-config="region=eu-west-3"
        working-directory: ./terraform
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
          -var="region=eu-west-3" \
          -var="public_key=$PUBLIC_SSH_KEY" \
          -var="private_key=$PRIVATE_SSH_KEY" \
          -var="key_name=deployer_key" \
          -out=PLAN
        working-directory: ./terraform
      - name: List files after plan
        run: ls -l
        working-directory: ./terraform

      - name: Terraform Apply
        id: apply
        run: terraform apply ./PLAN
        working-directory: ./terraform
      - name: Set output
        id: set-ip
        run: |
          instance_ip=$(terraform output -raw instance_public_ip)
          echo "::set-output name=instance_public_ip::$instance_ip"
        working-directory: ./terraform
      - name: Debug SERVER_PUBLIC_IP
        run: echo "SERVER_PUBLIC_IP=${{env.SERVER_PUBLIC_IP}}"
      - name: Show Terraform Outputs
        run: terraform output
        working-directory: ./terraform

  deploy-app:
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set IP env variable
        run: echo "SERVER_PUBLIC_IP=${{needs.deploy-infra.outputs.SERVER_PUBLIC_IP}}" >> $GITHUB_ENV

      - name: Verify SERVER_PUBLIC_IP
        run: echo "Server IP:${{env.SERVER_PUBLIC_IP}}"

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        env: 
          REGISTRY: ${{steps.login-ecr.outputs.registry}}
          REPOSITORY: exemple-node-app
          IMAGE_TAG: ${{github.sha}}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Debug Docker Environment
        run: |
          docker --version
          docker info
          whoami
          ls -l /var/run/docker.sock

      - name: Fix Docker Permissions
        run: |
          sudo usermod -aG docker $USER
          newgrp docker

      - name: Debug Variables
        run: |
          echo "REGISTRY=$REGISTRY"
          echo "REPOSITORY=$REPOSITORY"
          echo "IMAGE_TAG=$IMAGE_TAG"

      - name: Deploy Docker Image to EC2
        env:
          REGISTRY: ${{steps.login-ecr.outputs.registry}}
          REPOSITORY: exemple-node-app
          IMAGE_TAG: ${{github.sha}}
          AWS_DEFAULT_REGION: eu-west-3
        uses: appleboy/ssh-action@master
        with:
          host: ${{needs.deploy-infra.outputs.SERVER_PUBLIC_IP}}
          username: ubuntu
          key: ${{env.PRIVATE_SSH_KEY}}
          envs: PRIVATE_SSH_KEY,REGISTRY,REPOSITORY,IMAGE_TAG,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_DEFAULT_REGION,AWS_REGION
          script: |
              IMAGE="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
              echo "Authenticating with AWS ECR..."
              aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin $REGISTRY

              echo "Stopping and removing existing container (if any)..."
              sudo docker stop myappcontainer || true
              sudo docker rm myappcontainer || true

              echo "Pulling new Docker image: $IMAGE"
              sudo docker pull $IMAGE

              echo "Running the new container..."
              sudo docker run -d --name myappcontainer -p 80:8080 $IMAGE